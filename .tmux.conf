unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

bind n previous-window
bind m next-window

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-style dim
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
#set -g status-right '#[fg=colour233,bg=black,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style fg=colour81
setw -g window-status-current-style bg=colour238
setw -g window-status-current-style bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138
setw -g window-status-style bg=colour235
setw -g window-status-style none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style bold
setw -g window-status-bell-style fg=colour255
setw -g window-status-bell-style bg=colour1

set -g default-terminal "xterm-256color"

set-option -g detach-on-destroy off

#settings for the current path
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

set -g mouse on

# logic to save "INSIDE_EMACS" envar state
set-option -g update-environment "INSIDE_EMACS"

# logic for vim keys
set-window-option -g mode-keys vi
# Map 'v' to begin selection like Vim
bind-key -T copy-mode-vi v send -X begin-selection
# Map 'y' to copy selection like Vim
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
# Map 'C-v' to toggle rectangle selection (Visual Block mode)
bind-key -T copy-mode-vi C-v send -X rectangle-toggle


# ===== plain black tmux status =====
set -g status-style "bg=#000000,fg=white"
set -g status-bg "#000000"
set -g status-fg white

set -g window-status-style "bg=#000000,fg=white"
set -g window-status-current-style "bg=#000000,fg=white,bold"
set -g window-status-separator " "

set -g status-left ""
set -g status-left-length 0

setw -g window-status-format "#[bg=#000000,fg=white] #I:#{?#{==:#{window_name},[tmux]},tmux,#{window_name}} "

setw -g window-status-current-format "#[bg=#000000,fg=green,bold][#[fg=white,bg=#000000,bold]#I:#{?#{==:#{window_name},[tmux]},tmux,#{window_name}}#[fg=green,bg=#000000,bold]]"

set -g status-right "#[bg=#000000,fg=white] %H:%M "
set -g status-right-length 10

set -g mode-style "bg=#b3c59d,fg=black"




